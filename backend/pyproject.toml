[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cardwise-ai-backend"
version = "0.1.0"
description = "CardWise AI deterministic rewards calculator"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "alembic>=1.14,<2.0",
    "argon2-cffi>=23.1,<26.0",
    "pydantic>=2.9,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.7,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
