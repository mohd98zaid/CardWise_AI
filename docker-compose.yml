services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cardwise
      POSTGRES_USER: cardwise
      POSTGRES_PASSWORD: cardwise_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cardwise-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardwise -d cardwise"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://cardwise:cardwise_local_only@postgres:5432/cardwise
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend

volumes:
  cardwise-postgres:
